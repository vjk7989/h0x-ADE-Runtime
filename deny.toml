# cargo deny check advisories: CI fails on a dependency with a RustSec
# security advisory. Unmaintained crates are reported as warnings.

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
# bincode 2.0.1: the maintainers ceased development; 1.3.3 and 2.0.1 are
# considered complete. It encodes our wire protocol, so replacing it is a
# protocol change, not a dependency bump.
ignore = ["RUSTSEC-2025-0141"]
